name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Install and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check every JavaScript file for syntax errors
        run: for f in *.js; do node --check "$f"; done

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t whatsapp-bot:ci .
      - name: Start container and call /health
        run: |
          docker run -d --name bot -p 3000:3000 whatsapp-bot:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          echo "Health check failed"; docker logs bot; exit 1
